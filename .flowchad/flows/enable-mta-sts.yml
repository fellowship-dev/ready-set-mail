name: Hosted owner turns on MTA-STS and sees TLS reports arrive
goal: MTA-STS is on in testing mode for a domain, its policy is served, and the page shows the first TLS report a sender sent
value_moment: The first TLS report is on the page (reporter, period, successful and failed sessions) while MTA-STS is on in testing mode
# Pages and server files on the path. A change to any of them needs a fresh walk record.
covers:
  - web/src/pages/wizards/MtaStsPage.tsx
  - web/src/components/mta-sts/*
  - web/src/components/domain/DnsTools.tsx
  - web/src/lib/mta-sts.ts
  # Server files that implement the steps: availability, enable, the checks, the policy host, the reports.
  - src/mta-sts/*
  - src/email/mta-sts.ts
  - src/email/tls-rpt.ts
  - src/hosted/tls-intake.ts
  - packages/dns-checks/src/mta-sts.ts
url: /#/domains/1/mta-sts
tags: [mta-sts, value, protected]
priority: P1
viewports: [1440, 375]
video: false
context:
  user: workspace_owner
  auth: logged_in
  mode: hosted
  cloudflare: connected, zone reached
# The door is the MTA-STS card under DNS tools at the bottom of the domain page (below its first screen at both widths, see the map): the flow starts on the page it opens.
steps:
  - action: navigate
    url: /#/domains/1/mta-sts
    expect: The MTA-STS page - one plain sentence of what it is, the MX hosts found now, one sentence on testing mode, the action "Turn on in testing mode", and below it "Show records" (closed: Cloudflare writes them)
  - action: click
    selector: "text=Turn on in testing mode"
    effect: write
    expect: The same page says Setting up (waiting for the certificate), with a Check now action
  - action: click
    selector: "text=Check now"
    effect: write
    expect: The page says Testing and "Served at" the policy address (the result of a fetch of it, which the server repeats when the page is opened and the last one is over 10 minutes old) with "Checked <time>", a small secondary Check now (the claim can go stale), "Switch to enforce" (not filled while it cannot be pressed) with the whole enforce rule beneath it, each line Met or Missing, and the empty state "No signed TLS report yet"
  - action: navigate
    url: /#/domains/1/mta-sts
    expect: After a signed sender's first report has arrived, the TLS reports of the last 30 days list who sent it, the period, successful sessions, failed sessions and failure types
    first_value: true
