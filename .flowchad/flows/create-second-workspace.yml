name: Hosted owner creates a second workspace
goal: A person who already holds their free domain creates another workspace: at once when they already pay, otherwise after adding a card, and lands in the new workspace
value_moment: The new workspace exists and the person is in it (the workspace is created only once its card is verified)
# Not protected yet: the dashboard half is built in the next phase of the pull request.
covers:
  - web/src/components/CreateWorkspaceDialog.tsx
  - src/workspaces/routes.ts
  - src/billing/plan-workspaces.ts
  - src/billing/routes.ts
url: /#/settings
tags: [billing, value]
priority: P1
context:
  user: workspace_owner
  auth: logged_in
  mode: hosted
  billing: on (test keys)
  plan: HOSTED_PLAN=free_one_domain, the person's free domain already used
steps:
  - action: navigate
    url: /#/
    expect: The dashboard with the workspace switcher
  - action: click
    selector: "role=button[name=/^Workspace: .*Switch workspace$/]"
    expect: The switcher menu
  - action: click
    selector: "role=menuitem[name='Create workspace']"
    expect: Name the workspace
  - action: fill
    selector: "#workspace-name"
    value: Client A
    expect: The name typed
  - action: click
    selector: "role=button[name='Create workspace']"
    expect: Not paying yet - "Add a card to create more workspaces" and what it means in one sentence; the one action is Add a card to continue
  - action: click
    selector: "text=Add a card to continue"
    effect: write
    expect: Stripe-hosted Checkout in setup mode, then back inside the new workspace ("Workspace created")
    first_value: true
