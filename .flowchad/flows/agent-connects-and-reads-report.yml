name: An AI agent connects by MCP and reads its first email report
goal: An MCP client is authorized by its person and gets a useful report for one domain
value_moment: The agent receives its first useful report (get_email_report)
covers:
  - src/mcp/consent.ts
  - src/mcp/discovery.ts
  - src/llms-txt.ts
  - web/src/pages/agent/AgentSetupPage.tsx
  - web/src/pages/auth/*
url: /llms.txt
tags: [agents, value, protected]
priority: P1
context:
  user: existing_account
  auth: logged_out
steps:
  - action: navigate
    url: /llms.txt
    expect: Plain text naming the MCP endpoint
  - action: navigate
    url: /mcp
    expect: 401 with OAuth metadata; the client registers
  - action: click
    selector: "button[type=submit]"
    effect: write
    expect: Browser sign-in, then the consent page listing domains, actions and expiry with Allow access
  - action: click
    selector: "text=Allow access"
    effect: write
    expect: Token issued; whoami, list_domains and get_email_report answer
    first_value: true
