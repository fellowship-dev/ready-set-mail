name: New hosted user signs up and gets DMARC with the report address live by adding records by hand
goal: A new workspace proves one domain with the TXT record and publishes DMARC at another DNS host
value_moment: Records live - ownership proven by the TXT record and DMARC seen in public DNS, carrying the shared report address when the server admits the workspace to reports (HOSTED_CONNECT_REPORTS; by default only the operator's own workspaces)
covers:
  - web/src/app.tsx
  - web/src/pages/auth/*
  - web/src/pages/wizards/SetupWizardPage.tsx
  - web/src/pages/wizards/cloudflare/FirstScreen.tsx
  - web/src/pages/wizards/setup/*
  - web/src/components/wizard/*
  - web/src/components/domain/ClaimCard.tsx
  - web/src/components/domain/ClaimPreview.tsx
  - web/src/components/domain/ProofRecord.tsx
  # Server files that implement the steps: sign-up and the code, the first screen, ownership, adding domains, and the writes.
  - src/auth/routes.ts
  - src/auth/codes.ts
  - src/auth/signup-policy.ts
  - src/auth/bot-protection.ts
  - src/auth/turnstile.ts
  - src/domains/ownership.ts
  - src/domains/service.ts
  - src/api/router.ts
  - src/domains/claim-preview.ts
url: /#/signup
tags: [onboarding, value, protected]
priority: P0
context:
  user: new_account
  auth: logged_out
  mode: hosted
steps:
  - action: navigate
    url: /#/signup
    expect: Create an account - email, password and the bot check
  - action: click
    selector: "button[type=submit]"
    effect: write
    expect: Enter the 6-digit code sent by email
  - action: click
    selector: "text=I'll add DNS records myself"
    expect: Domain field (prefilled when the link carries a domain)
  - action: click
    selector: "text=Continue"
    effect: write
    expect: Verify you own this domain - the TXT record and Verify
  - action: click
    selector: "text=Verify"
    effect: write
    expect: Wizard SPF, DKIM, DMARC, Reports; DMARC published at the DNS host (with the report address only for a workspace HOSTED_CONNECT_REPORTS admits)
    first_value: true
