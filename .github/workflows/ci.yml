# Install + test on every pull request and push to main. Independent of deploy.yml
# (manual deployment only; these checks do not deploy).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Install + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-flows compares with the merge base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run test:web
      - run: npm run build:dashboard
      # Agent memory (AGENTS.md): the docs, single-source and flow-map tests run inside `npm test` (test/agent-memory/).
      # This step fails a change that touches a page on a protected value flow without a fresh walk record.
      - name: Protected flows have a fresh walk record
        run: bash scripts/check-flows.sh ${{ github.event_name == 'push' && github.event.before || '' }}
